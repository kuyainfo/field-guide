<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索圖鑑｜審核後台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF6ED;--cream-2:#F5EFE0;--card:#FFFFFF;
  --edge:#EADFC8;--edge-2:#E0D4BA;--rule:#F0E8D6;
  --ink:#1D4A33;--ink-2:#55665A;--ink-3:#8E8267;
  --act:#C4482A;--act-dark:#A93A1F;--act-text:#B23E22;
  --gold:#8F6212;--gold-bg:#F5E7C3;--ok:#2F7D4F}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;
  font-size:15px;line-height:1.7;padding:0 40px 60px;max-width:1280px;margin:0 auto}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
h1{font-size:22px;font-weight:900;letter-spacing:.02em}
.sub{color:var(--ink-2);font-size:12.5px;margin-bottom:18px}
.hide{display:none !important}

.weave{height:14px;margin:0 -40px 24px;background-color:#F3ECDC;
  background-image:repeating-linear-gradient(45deg,var(--act) 0 1.5px,transparent 1.5px 13px),
    repeating-linear-gradient(-45deg,var(--ink) 0 1.5px,transparent 1.5px 13px)}

.head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.head .hlogo{height:27px;width:auto;display:block;flex:none}
.head .live{margin-left:auto;display:flex;align-items:center;gap:7px;background:#fff;
  border:1px solid var(--edge);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--ink-2)}
.head .live i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}

input{background:#fff;border:1px solid var(--edge-2);border-radius:12px;padding:13px;
  color:var(--ink);font-size:16px;font-family:inherit;width:100%;max-width:300px}
.btn{background:var(--act);color:#FFF6F1;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:700}
.btn.ok{background:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:14px 18px}
.stat b{display:block;font-size:30px;font-weight:900;line-height:1.1;color:var(--ink)}
.stat span{font-size:12px;color:var(--ink-2)}
.stat.w{border-color:#E5D5AE}.stat.w b{color:var(--gold)}
.stat.r b{color:var(--act-text)}
.stat.p{border-color:#E8CCBF}.stat.p b{color:var(--act-text)}

.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:8px 18px;border:1px solid var(--edge-2);border-radius:999px;font-size:13.5px;
  color:var(--ink-2);background:#fff}
.tab.on{background:var(--ink);border-color:var(--ink);color:#F4F8F2;font-weight:700}

.wrap{background:var(--card);border:1px solid var(--edge);border-radius:16px;overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{position:sticky;top:0;background:var(--cream-2);text-align:left;font-weight:500;
  font-size:12px;letter-spacing:.06em;color:var(--ink-2);padding:12px 18px;white-space:nowrap;z-index:1}
tbody td{padding:14px 18px;border-top:1px solid var(--rule);vertical-align:middle}
tbody tr:hover{background:#FDFAF3}
.unit{font-size:15.5px;font-weight:700;color:var(--ink)}
.code{font-size:11.5px;color:var(--ink-3)}
.meter{display:flex;align-items:center;gap:12px;min-width:180px}
.meter i{flex:1;height:7px;background:#EFE7D5;border-radius:4px;overflow:hidden;display:block}
.meter i b{display:block;height:7px;background:var(--ink);border-radius:4px}
.meter span{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.wait{font-size:12.5px;font-weight:500;padding:3px 11px;border-radius:999px;background:var(--gold-bg);color:#6B4F0F}
.wait.none{background:none;color:#B3A484;padding:0}
.mini{font-size:12.5px;padding:6px 13px;border-radius:9px;border:1px solid var(--edge-2);
  background:#fff;white-space:nowrap;color:var(--ink-2)}
.mini.go{background:var(--act);border-color:var(--act);color:#FFF6F1;font-weight:700}
.mini.undo{color:var(--ink-2)}
.mini.del{color:var(--act-text);border-color:#E8CCBF}
.mini.del:hover{background:#FBEDE7}
.locked{font-size:13px;color:var(--ink-3)}
.done{font-size:13px;font-weight:500;color:var(--ok)}

.fam{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.fam-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fam-n{font-size:17px;font-weight:700}
.fam-m{font-size:12.5px;color:var(--ink-2)}

.zgroup{margin-bottom:10px}
.zhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 12px;border:1px solid var(--edge);border-radius:12px;background:var(--cream-2)}
.zhead:hover{background:#F0E8D6}
.zhead .cnt{font-size:12.5px;color:var(--ink-2);margin-left:auto}
.zhead .chev{font-size:11px;color:var(--ink-3);width:12px;text-align:center}
.zgroup .grid{margin-top:10px;margin-bottom:14px}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.spacer{visibility:hidden}

.shot{background:#fff;border:1px solid var(--edge);border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column}
.shot.blank{background:#FBF7EE;border-style:dashed}
.shot img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#F1EADB;cursor:zoom-in}
.shot .no{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
  color:#B3A484;font-size:12px;background:#F4EEE0;text-align:center;padding:0 10px;line-height:1.6}
.meta{flex:1;display:flex;flex-direction:column;gap:5px;padding:10px 12px 8px}
.zone{align-self:flex-start;font-size:11.5px;font-weight:500;letter-spacing:.05em;
  padding:2px 10px;border-radius:999px}
.z1{background:#C4482A;color:#FAE3DC}
.z2{background:#8F6212;color:#F7ECCE}
.z3{background:#2A6070;color:#D8EEF3}
.txt{font-size:12.5px;line-height:1.5;color:#2C3B2F;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.state{min-height:22px}
.acts{display:flex;gap:6px;padding:0 12px 12px}
.acts button{flex:1;font-size:12.5px;padding:7px;border-radius:8px;
  border:1px solid var(--edge-2);background:#fff;color:var(--ink-2)}
.acts .y{background:var(--ink);color:#F4F8F2;border-color:var(--ink);font-weight:500}
.acts .n{background:#FBEDE7;color:var(--act-text);border-color:#E8CCBF}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:999px}
.b-ok{background:var(--ink);color:#F4F8F2}
.b-no{background:var(--act-text);color:#FCEFEA}
.b-wait{background:var(--gold-bg);color:#6B4F0F}
.b-none{background:#F1EADB;color:var(--ink-2)}
.empty{color:var(--ink-2);font-size:14px;padding:30px 0}

.lb{position:fixed;inset:0;background:rgba(28,22,10,.88);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:9}
.lb img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:8px}
</style>
</head>

var TIERS = [8, 12];
var TOTAL = 12;
var COLS = 4;

var TASKS = [
  { id:"m1", zone:"博物館", text:"博物館外的裝置藝術" },
  { id:"m2", zone:"博物館", text:"館內泰雅織紋圖案" },
  { id:"m3", zone:"博物館", text:"Gaga 圓牌掛上牆後合照" },
  { id:"m4", zone:"博物館", text:"館內與山林生存有關的展品" },
  { id:"s1", zone:"老街",   text:"烏來橋，紅白菱形欄杆短橋" },
  { id:"s2", zone:"老街",   text:"老街小吃，看得出在老街裡" },
  { id:"s3", zone:"老街",   text:"覽勝大橋，透明玻璃平台" },
  { id:"s4", zone:"老街",   text:"老街台車站旁壁畫" },
  { id:"f1", zone:"瀑布",   text:"瀑布台車站外，台車或軌道" },
  { id:"f2", zone:"瀑布",   text:"勇士廣場大型人像" },
  { id:"f3", zone:"瀑布",   text:"導覽 QR 介紹的景物" },
  { id:"f4", zone:"瀑布",   text:"勇士廣場與烏來瀑布合影" }
];
var ZONE_ORDER = ["博物館", "老街", "瀑布"];
var ZC = { "博物館":"z1", "老街":"z2", "瀑布":"z3" };

var db, root, DATA = {}, filter = "overview", connErr = "";
var zoneOpen = {};   /* 使用者手動展開或收起的紀錄 */

document.getElementById("gatelogo").src = LOGO;
document.getElementById("in").onclick = enter;
document.getElementById("pw").onkeydown = function(e){ if(e.key === "Enter") enter(); };

function enter(){
  if(document.getElementById("pw").value !== PASS){
    document.getElementById("bad").classList.remove("hide"); return;
  }
  document.getElementById("gate").classList.add("hide");
  document.getElementById("main").classList.remove("hide");
  render();
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    root = db.ref(DB_ROOT + "/families");
    root.on("value",
      function(s){ DATA = s.val() || {}; connErr = ""; render(); },
      function(err){ connErr = String((err && err.message) || err); render(); });
  }catch(e){ connErr = String(e); render(); }
}

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function thumb(id, w){ return "https://drive.google.com/thumbnail?id=" + id + "&sz=w" + w; }
function okOf(f){ var t = f.tasks || {}; return Object.keys(t).filter(function(i){ return t[i].status === "approved"; }).length; }
function pendOf(f){ var t = f.tasks || {}; return Object.keys(t).filter(function(i){ return t[i].status === "pending"; }).length; }

function counts(){
  var c = { fam:0, pending:0, approved:0, rejected:0, claim:0 };
  Object.keys(DATA).forEach(function(k){
    var f = DATA[k] || {}; c.fam++;
    var t = f.tasks || {};
    Object.keys(t).forEach(function(id){ if(c[t[id].status] !== undefined) c[t[id].status]++; });
    var ok = okOf(f), cl = f.claimed || {};
    TIERS.forEach(function(n){ if(ok >= n && !cl["t" + n]) c.claim++; });
  });
  return c;
}

function errBanner(){
  if(!connErr) return "";
  return '<div style="background:#FBEDE7;border:1px solid #E8C9BE;border-radius:12px;padding:12px 15px;margin-bottom:16px;font-size:13.5px;line-height:1.7;color:#7A2E16">'
    + '連不上資料庫：' + esc(connErr)
    + '<br>若顯示 permission denied，請到 Firebase 控制台的規則頁，替 <b>fieldguide_beone_1017</b> 節點開啟讀寫。</div>';
}

function render(){
  var c = counts();
  var html = '<div class="weave"></div>'
    + '<div class="head"><img class="hlogo" src="' + LOGO + '" alt="BeOne">'
    +   '<div><h1>探索圖鑑　審核後台</h1>'
    +   '<p class="sub" style="margin:0">按下通過的同一秒，玩家手機就會更新</p></div>'
    +   '<span class="live"><i></i>即時同步中</span></div>'
    + errBanner()
    + '<div class="stats">'
    +   '<div class="stat"><b>' + c.fam + '</b><span>參加單位</span></div>'
    +   '<div class="stat w"><b>' + c.pending + '</b><span>待審核</span></div>'
    +   '<div class="stat"><b>' + c.approved + '</b><span>已通過</span></div>'
    +   '<div class="stat r"><b>' + c.rejected + '</b><span>已退回</span></div>'
    +   '<div class="stat p"><b>' + c.claim + '</b><span>待發獎</span></div>'
    + '</div>'
    + '<div class="tabs">' + tab("overview","總覽") + tab("pending","待審核")
    + tab("all","全部照片") + tab("approved","已通過") + tab("rejected","已退回") + '</div>';

  html += filter === "overview" ? overview() : reviewList();
  document.getElementById("main").innerHTML = html;
  bind();
}

function tab(k, label){
  return '<button class="tab' + (filter === k ? " on" : "") + '" data-tab="' + k + '">' + label + '</button>';
}

/* ── 總覽：進度與獎品核銷 ── */
function overview(){
  var keys = Object.keys(DATA);
  if(!keys.length) return '<p class="empty">還沒有人開始，等參加者掃碼進入就會出現。</p>';

  keys.sort(function(a,b){
    var d = okOf(DATA[b]) - okOf(DATA[a]);
    return d !== 0 ? d : (DATA[a].createdAt || 0) - (DATA[b].createdAt || 0);
  });

  var rows = keys.map(function(k){
    var f = DATA[k] || {}, ok = okOf(f), pend = pendOf(f), cl = f.claimed || {};
    var pct = Math.round(ok / TOTAL * 100);

    var cells = TIERS.map(function(n){
      if(cl["t" + n]) return '<td><span class="done">已發放</span> '
        + '<button class="mini undo" data-undo="' + k + '" data-tier="' + n + '">取消</button></td>';
      if(ok >= n) return '<td><button class="mini go" data-claim="' + k + '" data-tier="' + n + '">核銷發獎</button></td>';
      return '<td><span class="locked">差 ' + (n - ok) + ' 張</span></td>';
    }).join("");

    return '<tr>'
      + '<td><div class="unit">' + esc(f.name || "未命名") + '</div><div class="code">' + (f.dept ? esc(f.dept) + '　' : '') + k + '</div></td>'
      + '<td><div class="meter"><i><b style="width:' + pct + '%"></b></i><span>' + ok + ' / ' + TOTAL + '</span></div></td>'
      + '<td><span class="wait' + (pend ? "" : " none") + '">' + (pend ? pend + " 張待審" : "—") + '</span></td>'
      + cells
      + '<td><button class="mini del" data-del="' + k + '">刪除</button></td></tr>';
  }).join("");

  return '<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="mini del" id="wipe">清除所有資料</button></div>'
    + '<div class="wrap"><table><thead><tr>'
    + '<th>參加單位・部門</th><th>進度</th><th>待審</th>'
    + '<th>第一階段 ' + TIERS[0] + ' 張</th><th>第二階段 ' + TIERS[1] + ' 張</th><th></th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
    + '<p class="sub" style="margin-top:12px">依完成張數排序，快完成的在最上面。核銷後玩家手機會顯示「已領取」，按錯可以按取消還原。</p>';
}

/* ── 審核清單 ── */
function reviewList(){
  var keys = Object.keys(DATA).sort(function(a,b){
    return (DATA[b].createdAt || 0) - (DATA[a].createdAt || 0);
  });
  var blocks = keys.map(famBlock).filter(Boolean);
  return blocks.length ? blocks.join("") : '<p class="empty">目前沒有符合條件的照片。</p>';
}

function famBlock(fid){
  var f = DATA[fid] || {}, tasks = f.tasks || {};
  var showAll = (filter === "all");

  var pick = TASKS.filter(function(t){
    var st = tasks[t.id] && tasks[t.id].status;
    return showAll ? true : st === filter;
  });
  if(!pick.length) return "";

  /* 依博物館→老街→瀑布分組，整區審完就預設收起 */
  var shots = "";
  ZONE_ORDER.forEach(function(z){
    var g = pick.filter(function(t){ return t.zone === z; });
    if(!g.length) return;

    var tally = { pending:0, approved:0, rejected:0, none:0 };
    g.forEach(function(t){
      var s = tasks[t.id] && tasks[t.id].status;
      if(s === "pending" || s === "approved" || s === "rejected") tally[s]++;
      else tally.none++;
    });

    var np = tally.pending;
    var parts = [];
    if(tally.pending)  parts.push(tally.pending  + " 待審");
    if(tally.approved) parts.push(tally.approved + " 已通過");
    if(tally.rejected) parts.push(tally.rejected + " 已退回");
    if(tally.none)     parts.push(tally.none     + " 未上傳");

    var key = fid + "|" + z;
    var open = (key in zoneOpen) ? zoneOpen[key] : (np > 0);
    var cnt = parts.join("\u30fb");

    var cards = open
      ? '<div class="grid">' + g.map(function(t){ return shotCard(fid, tasks[t.id], t); }).join("") + '</div>'
      : "";

    shots += '<div class="zgroup"><button class="zhead" data-zg="' + key + '" data-open="' + (open ? 1 : 0) + '">'
      + '<span class="zone ' + (ZC[z] || "") + '">' + z + '</span>'
      + '<span class="cnt">' + cnt + '</span>'
      + '<span class="chev">' + (open ? "\u25be" : "\u25b8") + '</span>'
      + '</button>' + cards + '</div>';
  });

  var pend = pendOf(f);
  return '<div class="fam"><div class="fam-h">'
    + '<div><div class="fam-n">' + esc(f.name || "未命名") + '</div>'
    + '<div class="fam-m">' + (f.dept ? esc(f.dept) + '　' : '') + '已通過 ' + okOf(f) + ' / ' + TOTAL + '　待審 ' + pend + '　代號 ' + fid + '</div></div>'
    + (pend ? '<button class="btn ok" data-all="' + fid + '">這組全部通過</button>' : "")
    + '</div>' + shots + '</div>';
}

function shotCard(fid, t, meta){
  var zc = ZC[meta.zone] || "";
  var head = '<div class="meta">'
    + '<div class="zone ' + zc + '">' + meta.zone + '</div>'
    + '<div class="txt" title="' + esc(meta.text) + '">' + esc(meta.text) + '</div>';

  if(!t || !t.status){
    return '<div class="shot blank"><div class="no">尚未上傳</div>'
      + head + '<div class="state"><span class="badge b-none">未完成</span></div></div></div>';
  }

  var img = t.fileId
    ? '<img src="' + thumb(t.fileId, 600) + '" alt="" data-big="' + t.fileId + '" loading="lazy">'
    : '<div class="no">沒有照片檔<br>（離線模式上傳）</div>';

  var badge = t.status === "approved" ? '<span class="badge b-ok">已通過</span>'
            : t.status === "rejected" ? '<span class="badge b-no">已退回</span>'
            : '<span class="badge b-wait">待審核</span>';

  return '<div class="shot">' + img + head
    + '<div class="state">' + badge + '</div></div>'
    + '<div class="acts">'
    +   '<button class="y" data-a="approved" data-f="' + fid + '" data-t="' + meta.id + '">通過</button>'
    +   '<button class="n" data-a="rejected" data-f="' + fid + '" data-t="' + meta.id + '">退回</button>'
    + '</div></div>';
}

/* ── 綁定 ── */
function bind(){
  each("[data-tab]", function(b){ b.onclick = function(){ filter = b.dataset.tab; render(); }; });

  each("[data-a]", function(b){
    b.onclick = function(){ if(root) root.child(b.dataset.f + "/tasks/" + b.dataset.t + "/status").set(b.dataset.a); };
  });

  each("[data-all]", function(b){
    b.onclick = function(){
      if(!root) return;
      var fid = b.dataset.all, tasks = (DATA[fid] || {}).tasks || {}, up = {};
      Object.keys(tasks).forEach(function(id){ if(tasks[id].status === "pending") up[id + "/status"] = "approved"; });
      if(Object.keys(up).length) root.child(fid + "/tasks").update(up);
    };
  });

  each("[data-claim]", function(b){
    b.onclick = function(){
      if(!root) return;
      var fid = b.dataset.claim, n = b.dataset.tier;
      var nm = (DATA[fid] || {}).name || "未命名";
      if(!confirm("確定把第 " + n + " 張階段的獎品發給「" + nm + "」？")) return;
      root.child(fid + "/claimed/t" + n).set(true);
    };
  });

  each("[data-undo]", function(b){
    b.onclick = function(){
      if(!root) return;
      var fid = b.dataset.undo, n = b.dataset.tier;
      if(!confirm("取消這筆發放紀錄？玩家端會變回可領取。")) return;
      root.child(fid + "/claimed/t" + n).set(null);
    };
  });

  each("[data-del]", function(b){
    b.onclick = function(){
      if(!root) return;
      var fid = b.dataset.del, nm = (DATA[fid] || {}).name || "未命名";
      if(!confirm("刪除「" + nm + "」的整筆資料？照片仍留在雲端硬碟，但這一組的進度會完全消失，無法復原。")) return;
      root.child(fid).remove();
    };
  });

  var wipe = document.getElementById("wipe");
  if(wipe) wipe.onclick = function(){
    if(!root) return;
    var n = Object.keys(DATA).length;
    if(!n){ alert("目前沒有資料。"); return; }
    if(!confirm("要清除全部 " + n + " 組資料嗎？這個動作無法復原。")) return;
    if(prompt("確認請輸入「清除」兩個字") !== "清除") return;
    root.remove();
  };

  each("[data-zg]", function(b){
    b.onclick = function(){
      zoneOpen[b.dataset.zg] = (b.dataset.open !== "1");
      render();
    };
  });

  each("[data-big]", function(i){
    i.onclick = function(){
      document.getElementById("lbi").src = thumb(i.dataset.big, 1600);
      document.getElementById("lb").classList.remove("hide");
    };
  });
}

document.getElementById("lb").onclick = function(){ this.classList.add("hide"); };
function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
</script>
</body>

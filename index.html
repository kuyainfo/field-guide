<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6ED">
<title>百濟探索圖鑑｜烏來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF6ED; --cream-2:#F3ECDC; --card:#FFFFFF;
  --edge:#EADFC8; --edge-2:#E0D4BA;
  --ink:#1D4A33; --ink-2:#55665A; --ink-3:#8E8267;
  --act:#C4482A; --act-dark:#A93A1F; --act-text:#B23E22;
  --gold:#8F6212; --gold-bg:#F5E7C3; --gold-line:#B8891F;
  --z1:#C4482A; --z2:#8F6212; --z3:#2A6070;
  --wv:#C4482A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream);color:var(--ink)}
body{font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.75;
  padding:0 20px calc(40px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;
  -webkit-font-smoothing:antialiased}
h1,h2{font-weight:900;letter-spacing:.02em}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--act);outline-offset:3px}
.hide{display:none !important}

/* 泰雅織紋帶：45 度雙向細線交織成菱形格 */
.weave{height:16px;margin:0 -20px;background-color:var(--cream-2);
  background-image:
    repeating-linear-gradient(45deg,var(--wv) 0 1.5px,transparent 1.5px 13px),
    repeating-linear-gradient(-45deg,var(--ink) 0 1.5px,transparent 1.5px 13px)}
.weave.gap{margin:22px -20px 26px}
.weave.z1{--wv:#C4482A}.weave.z2{--wv:#8F6212}.weave.z3{--wv:#2A6070}

.brand{display:flex;align-items:center;gap:10px;padding-top:20px}
.brand img{height:25px;width:auto;display:block;flex:none}
.brand span{font-size:11.5px;letter-spacing:.06em;color:var(--ink-2)}

.topbar{display:flex;align-items:center;gap:10px;padding:16px 0 10px;min-height:52px}
.back{display:flex;align-items:center;gap:5px;color:var(--ink-2);font-size:13.5px;padding:6px 2px}
.back svg{width:14px;height:14px}
.eyebrow{font-family:Caveat,cursive;font-size:27px;line-height:1;color:var(--act-text);margin-top:10px}
.title{font-size:30px;line-height:1.18;margin-top:2px;color:var(--ink)}
.sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.sect{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--ink-2);margin:26px 0 10px}

.prog{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:15px 16px;margin-top:18px}
.prog-head{display:flex;align-items:baseline;gap:8px;margin-bottom:11px}
.prog-head b{font-size:15px;font-weight:700}
.prog-head em{font-style:normal;font-size:12px;color:var(--ink-2)}
.prog-head .n{margin-left:auto;font-size:13px;font-weight:700;color:var(--act-text)}
.tally{display:flex;gap:5px}
.tally i{flex:1;height:20px;background:#EFE7D5;
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:background .35s}
.tally i.tier{background:var(--gold-bg)}
.tally i.on{background:var(--ink)}
.tally-legend{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:5px;
  font-size:11px;color:var(--gold);text-align:center;font-weight:700}

.card{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--edge);border-radius:14px;padding:13px 15px;margin-bottom:9px}
.card:active{background:#FBF7EE}
.zmark{width:26px;height:26px;flex:none;border-radius:4px;transform:rotate(45deg)}
.zmark.z1{background:var(--z1)}.zmark.z2{background:var(--z2)}.zmark.z3{background:var(--z3)}
.card-main{flex:1 1 auto;min-width:0}
.card-name{display:block;font-size:15.5px;font-weight:700;color:var(--ink)}
.card-sub{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px;line-height:1.5}
.card-end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.count{font-size:13px;font-weight:700;color:var(--ink)}
.count.zero{color:var(--ink-2)}
.pips{display:flex;gap:4px}
.pips i{width:9px;height:9px;background:var(--edge-2);border-radius:2px;transform:rotate(45deg)}
.pips i.on{background:var(--ink)}

.zhead{display:flex;align-items:center;gap:13px;margin-top:2px}
.zhead .zmark{width:30px;height:30px;border-radius:5px}
.zhead-main{flex:1 1 auto;min-width:0}
.zhead-main .title{font-size:25px;margin:0}
.zsub{font-size:12.5px;font-weight:500;margin-top:1px}
.zsub.z1{color:var(--z1)}.zsub.z2{color:var(--z2)}.zsub.z3{color:var(--z3)}

.task{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px;margin-bottom:10px}
.task.rej{border-color:#E8C9BE}
.task:active{background:#FBF7EE}
.thumb{width:64px;height:64px;flex:none;border-radius:9px;background:#F4EEE0;
  border:1px dashed #D2C4A5;display:flex;align-items:center;justify-content:center;
  color:#B3A484;overflow:hidden}
.thumb.has{border:1px solid var(--edge);background:var(--card)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:24px;height:24px}
.task-body{flex:1 1 auto;min-width:0}
.task-text{display:block;font-size:13.5px;line-height:1.55;color:#2C3B2F}

.tag{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 10px;border-radius:999px;
  margin-top:7px;line-height:1.7}
.t-todo{background:#F1EADB;color:var(--ink-2)}
.t-pending{background:var(--gold-bg);color:#6B4F0F}
.t-approved{background:var(--ink);color:#F4F8F2}
.t-rejected{background:var(--act-text);color:#FCEFEA}
.tagrow{display:flex;gap:9px;align-items:center;margin-top:2px;flex-wrap:wrap}
.tagrow .tag{margin-top:0}
.t-zone.z1{background:var(--z1);color:#FAE3DC}
.t-zone.z2{background:var(--z2);color:#F7ECCE}
.t-zone.z3{background:var(--z3);color:#D8EEF3}
.tasktitle{font-size:19.5px;font-weight:700;line-height:1.55;margin-top:11px;color:var(--ink)}

.prize{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--edge);
  border-radius:14px;padding:12px 15px;margin-bottom:9px}
.pmark{width:30px;height:30px;flex:none;border-radius:5px;transform:rotate(45deg);
  background:var(--gold-bg);border:1.5px solid var(--gold-line);
  display:flex;align-items:center;justify-content:center}
.pmark b{transform:rotate(-45deg);font-size:13px;font-weight:900;color:#6B4F0F}
.prize-main{flex:1 1 auto;min-width:0}
.prize-name{display:block;font-size:14.5px;font-weight:700;color:var(--ink)}
.prize-note{display:block;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.prize.locked{opacity:.6}
.prize.locked .pmark{background:#F1EADB;border-color:#C6B893}
.prize.locked .pmark b{color:var(--ink-2)}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:var(--act);color:#FFF6F1;padding:16px;border-radius:12px;
  font-size:16.5px;font-weight:700;letter-spacing:.04em;margin-top:12px}
.btn:active{background:var(--act-dark)}
.btn.ghost{background:transparent;border:1.5px solid #C0CDBE;color:var(--ink);
  font-size:15px;font-weight:500;padding:14px}
.btn.ghost:active{background:#F1EFE4}
input[type=text]{width:100%;background:var(--card);border:1px solid var(--edge-2);
  border-radius:12px;padding:14px;color:var(--ink);font-size:16px;font-family:inherit}
input[type=text]::placeholder{color:#B3A484}
.err{color:var(--act-text);font-size:13px;margin-top:8px}
.note{font-size:12.5px;color:var(--ink-2);margin-top:10px;line-height:1.75}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--edge);
  font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;gap:10px}
.foot button{color:var(--ink-3);text-decoration:underline}

.route-link{margin-top:12px}
.mapicon{width:34px;height:34px;flex:none;border-radius:50%;background:#F1EADB;
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.mapicon svg{width:19px;height:19px}
.chev{flex:none;color:var(--ink-3);display:flex;align-items:center}
.chev svg{width:15px;height:15px}
/* 路線地圖 */
.mapsvg{display:block;width:100%;height:auto;background:#F3EDDF;border:1px solid var(--edge);
  border-radius:14px;overflow:hidden}
.mapsvg .mriver path{fill:none;stroke:#B9D4DD;stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
.mapsvg .mroad path{fill:none;stroke:#FFFFFF;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.mapsvg .mrail{fill:none;stroke:#C0AE84;stroke-width:4;stroke-dasharray:11 8;stroke-linecap:round}
.mapsvg .mroute-case{fill:none;stroke:#FAF6ED;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.mapsvg .mroute{fill:none;stroke:#C4482A;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.mapsvg text{font-family:inherit;paint-order:stroke;stroke:#F3EDDF;stroke-width:6;stroke-linejoin:round}
.mapsvg .mlab{font-size:23px;font-weight:700;fill:var(--ink)}
.mapsvg .msub{font-size:17px;fill:var(--ink-2)}
.mapsvg .mdot{font-size:18px;fill:var(--ink-2)}
.mapsvg .mnote{font-size:16px;fill:#8E8267}
.mapsvg .mscale path{fill:none;stroke:#A89A7C;stroke-width:2;stroke-linecap:butt}
.mapsvg .mnorth path{fill:#A89A7C;stroke:none}
.mapsvg .mwater{font-size:18px;font-weight:500;fill:#6E93A0;letter-spacing:.1em}
.mapsvg .marea{font-size:22px;font-weight:700;fill:#F4F8F2;stroke:none;letter-spacing:.06em}
.mapsvg .mtag{font-size:17px;font-weight:500;fill:#6B4F0F;stroke:none}


.mapgap{display:flex;align-items:center;gap:10px;padding:9px 0 10px}
.mapgap i{flex:1;height:0;border-top:2px dashed #C0AE84}
.mapgap span{font-size:12px;color:var(--gold);white-space:nowrap}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-family:inherit;font-size:11.5px;font-weight:500;padding:3px 11px;border-radius:999px;
  background:#fff;border:1px solid var(--edge-2);color:var(--ink-2)}
.chip.z1{border-color:#E2B3A5;color:var(--z1)}
.chip.z2{border-color:#DCC58C;color:var(--z2)}
.chip.z3{border-color:#A8C4CC;color:var(--z3)}
.chip.on{color:#FFFFFF;border-color:transparent}
.chip.z1.on{background:var(--z1)}
.chip.z2.on{background:var(--z2)}
.chip.z3.on{background:var(--z3)}

.hero{width:100%;aspect-ratio:4/3;background:#F4EEE0;border:1.5px dashed #D2C4A5;
  border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:#B3A484;overflow:hidden;margin-bottom:18px}
.hero.has{border:1px solid var(--edge);background:var(--card)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero svg{width:46px;height:46px}
.hero span{font-size:12.5px;color:#8E8267}

.banner{background:#FBEDE7;border:1px solid #E8C9BE;border-radius:12px;
  padding:13px 15px;margin-top:18px;font-size:13.5px;line-height:1.7;color:#7A2E16}
.netbar{background:var(--gold-bg);border:1px solid #E5D5AE;border-radius:12px;
  padding:10px 14px;margin-top:16px;font-size:12.5px;color:#6B4F0F}

.bar{height:3px;background:#EFE7D5;border-radius:2px;margin-top:16px;overflow:hidden}
.bar i{display:block;height:3px;width:38%;background:var(--act);animation:sl 1.1s infinite ease-in-out}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>

function resize(file, max, q, cb){
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function(){
    var w = img.width, h = img.height;
    if(w > h && w > max){ h = Math.round(h*max/w); w = max; }
    else if(h >= w && h > max){ w = Math.round(w*max/h); h = max; }
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    cb(c.toDataURL("image/jpeg", q));
  };
  img.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}

/* ── 照片暫存：放 IndexedDB，不佔 localStorage 的 5MB 額度 ── */
var IDB_NAME = "fg_photos", IDB_STORE = "blobs";
var memBlobs = {};            /* IndexedDB 不可用時的退路 */

function idbOpen(cb){
  try{
    if(!window.indexedDB){ cb(null); return; }
    var rq = indexedDB.open(IDB_NAME, 1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore(IDB_STORE); };
    rq.onsuccess = function(){ cb(rq.result); };
    rq.onerror   = function(){ cb(null); };
  }catch(e){ cb(null); }
}

function idbPut(key, val, cb){
  idbOpen(function(db){
    if(!db){ cb(false); return; }
    try{
      var tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = function(){ cb(true); };
      tx.onerror    = function(){ cb(false); };
      tx.onabort    = function(){ cb(false); };
    }catch(e){ cb(false); }
  });
}

function idbGet(key, cb){
  idbOpen(function(db){
    if(!db){ cb(null); return; }
    try{
      var rq = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(key);
      rq.onsuccess = function(){ cb(rq.result || null); };
      rq.onerror   = function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}

function idbDel(key){
  idbOpen(function(db){
    if(!db) return;
    try{ db.transaction(IDB_STORE, "readwrite").objectStore(IDB_STORE).delete(key); }catch(e){}
  });
}

function jobData(job, cb){
  if(memBlobs[job.key]){ cb(memBlobs[job.key]); return; }
  idbGet(job.key, cb);
}

/* ── 上傳佇列：拍完立刻入列，背景重試，不擋操作 ── */
var UP_TIMEOUT = 45000;   /* 單次上傳逾時 */
var UP_STUCK   = 75000;   /* 看門狗：超過就強制解鎖 */

function enqueue(taskId, dataUrl){
  /* 同一任務換照片：舊的留在佇列外，回應回來會被視為作廢 */
  queue = queue.filter(function(x){ return x.taskId !== taskId; });

  var key = "p_" + fid() + "_" + taskId;
  memBlobs[key] = dataUrl;
  idbPut(key, dataUrl, function(ok){
    if(!ok) return;                 /* 存不進去就只靠記憶體，重新整理才會遺失 */
    delete memBlobs[key];           /* 進了 IndexedDB 就把記憶體讓出來 */
  });

  queue.push({ taskId:taskId, key:key, tries:0, err:"" });
  saveQueue(); render(); pump();
}

var pumping = false, inflightSince = 0;

function pump(){
  if(!queue.length) return;
  if(pumping){
    if(Date.now() - inflightSince > UP_STUCK) pumping = false;   /* 卡住就解鎖重來 */
    else return;
  }
  if(!UPLOAD_URL){ flushOffline(); return; }
  if(!navigator.onLine) return;

  pumping = true;
  inflightSince = Date.now();
  var job = queue[0];

  jobData(job, function(data){
    if(!data){
      /* 照片不見了（清了瀏覽器資料或存檔失敗），移出佇列讓玩家重拍 */
      pumping = false;
      var k = queue.indexOf(job);
      if(k >= 0){ queue.splice(k, 1); saveQueue(); }
      render(); pump();
      return;
    }
    send(job, data);
  });
}

function send(job, data){
  var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var killer = setTimeout(function(){ if(ctl) ctl.abort(); }, UP_TIMEOUT);

  var opt = {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      fid: fid(), name: local.name, dept: local.dept, taskId: job.taskId,
      prev: (remote.tasks[job.taskId] && remote.tasks[job.taskId].fileId) || "",
      image: data
    })
  };
  if(ctl) opt.signal = ctl.signal;

  fetch(UPLOAD_URL, opt)
  .then(function(r){ return r.json(); })
  .then(function(res){
    clearTimeout(killer);
    pumping = false;
    var i = queue.indexOf(job);
    if(i < 0){ pump(); return; }        /* 已被新照片取代，這次結果作廢 */
    if(res && res.ok){
      queue.splice(i, 1); saveQueue();
      idbDel(job.key); delete memBlobs[job.key];
      writeTask(job.taskId, { status:"pending", fileId:res.fileId, at:Date.now() });
      render(); pump();
    }else{
      var e = (res && res.error) ? String(res.error) : "伺服器沒有回傳成功";
      job.busy = /too many|quota|exceeded|invoked|limit/i.test(e);
      job.err  = job.busy ? "伺服器忙碌中" : e;
      retry(job);
    }
  })
  .catch(function(e){
    clearTimeout(killer);
    pumping = false;
    var msg = String((e && e.message) || e);
    job.busy = false;
    job.err = /abort/i.test(msg) ? "上傳逾時" : "連線失敗";
    retry(job);
  });
}

function retry(job){
  job.tries = (job.tries || 0) + 1;
  saveQueue(); render();
  /* 壅塞時退得更久；每次都加隨機抖動，避免全場同時重試 */
  var base = job.busy ? 15000 : 3000;
  var wait = Math.min(45000, base * job.tries) + Math.floor(Math.random() * 4000);
  setTimeout(pump, wait);
}

function queueTrouble(){
  for(var i = 0; i < queue.length; i++){
    if((queue[i].tries || 0) >= 3) return queue[i];
  }
  return null;
}

/* 沒有上傳網址時的退路：狀態照走，照片只留在本機 */
function flushOffline(){
  while(queue.length){
    var j = queue.shift();
    writeTask(j.taskId, { status:"pending", fileId:"", at:Date.now() });
  }
  saveQueue(); render();
}

function writeTask(id, obj){
  remote.tasks[id] = obj;
  if(fref) fref.child("tasks/" + id).set(obj);
}

    });
    return '<button class="card" data-zone="' + z.id + '">'
      + '<span class="zmark z' + (zi + 1) + '"></span>'
      + '<span class="card-main"><span class="card-name">' + z.name + '</span>'
      + '<span class="card-sub">' + z.sub + '</span></span>'
      + '<span class="card-end"><span class="count' + (c ? "" : " zero") + '">' + c + ' / 4</span>'
      + '<span class="pips">' + pips + '</span></span></button>';
  }).join("");

  var prizes = PRIZES.map(function(p, i){
    var got = n >= p.at;
    var claimed = !!remote.claimed["t" + p.at];
    var label = p.name || ("第 " + (i + 1) + " 階段獎勵");
    var note = claimed ? "已領取" : got ? "可領取，請找工作人員" : "還差 " + (p.at - n) + " 張解鎖";
    return '<div class="prize' + (got ? "" : " locked") + '">'
      + '<span class="pmark"><b>' + p.at + '</b></span>'
      + '<span class="prize-main"><span class="prize-name">' + esc(label) + '</span>'
      + '<span class="prize-note">' + note + '</span></span></div>';
  }).join("");

  return brandRow()
    + '<p class="eyebrow">Wulai Field Guide</p>'
    + '<h1 class="title">百濟探索圖鑑</h1>'
    + '<p class="sub">烏來原鄉山林　10 / 17（六）</p>'
    + '<div class="prog"><div class="prog-head"><b>' + esc(local.name) + '</b>'
    +   (local.dept ? '<em>' + esc(local.dept) + '</em>' : '')
    +   '<span class="n">已通過 ' + n + ' / 12</span></div>'
    +   '<div class="tally">' + tally + '</div>'
    +   '<div class="tally-legend">' + legend + '</div></div>'
    + '<button class="card route-link" data-map="1">'
    +   '<span class="mapicon">' + ICON_ROUTE + '</span>'
    +   '<span class="card-main"><span class="card-name">探索路線</span>'
    +   '<span class="card-sub">從烏來橋走到瀑布，看看下一站在哪</span></span>'
    +   '<span class="chev">' + ICON_CHEV + '</span></button>'
    + netbar()
    + '<h2 class="sect">三個區域</h2>' + zones
    + '<h2 class="sect">獎勵</h2>' + prizes
    + (inAppBrowser() ? banner() : "")
    + '<div class="foot"><span>' + EVENT_INFO + '</span><button id="reset">重設</button></div>';
}

var MAP_ZC = { 1:"#C4482A", 2:"#8F6212", 3:"#2A6070" };

function mapPaths(list, cls){
  return list.map(function(d){ return '<path class="' + cls + '" d="' + d + '"/>'; }).join("");
}

/* 文字寬度估算，用來畫金色標籤的底 */
function mapTextW(txt, fs){
  var w = 0;
  for(var i = 0; i < txt.length; i++){
    var c = txt.charCodeAt(i);
    w += c > 255 ? fs : (c === 32 ? fs * 0.3 : fs * 0.56);
  }
  return w;
}

function mapPin(m){
  var tot = (m.t || []).length, done = 0;
  (m.t || []).forEach(function(id){ if(statusOf(id) === "approved") done++; });
  var full = tot > 0 && done === tot;
  var col = MAP_ZC[m.z];
  var gap = tot ? 28 : 22;
  var ax = m.side === "l" ? m.x - gap : m.x + gap;
  var an = m.side === "l" ? "end" : "start";
  var sub = m.note || "";

  /* 有任務的用菱形（填滿＝這點都通過了），沒任務的用空心圓點 */
  var mark = tot
    ? '<rect x="' + (m.x - 11) + '" y="' + (m.y - 11) + '" width="22" height="22" rx="3"'
      + ' transform="rotate(45 ' + m.x + ' ' + m.y + ')"'
      + ' fill="#FFFFFF" stroke="' + col + '" stroke-width="4"/>'
      + (full ? '<rect x="' + (m.x - 7) + '" y="' + (m.y - 7) + '" width="14" height="14" rx="2"'
        + ' transform="rotate(45 ' + m.x + ' ' + m.y + ')" fill="' + col + '"/>' : "")
    : '<circle cx="' + m.x + '" cy="' + m.y + '" r="7" fill="#FFFFFF" stroke="#A89A7C" stroke-width="3.5"/>';

  var out = '<g>' + mark
    + '<text x="' + ax + '" y="' + (m.y + (sub ? -4 : 8)) + '" text-anchor="' + an + '" class="mlab">' + m.label + '</text>';

  if(sub){
    var ny = m.y + 21;
    if(m.v){
      var w = mapTextW(sub, 17) + 24;
      var tx = m.side === "l" ? ax - 12 : ax + 12;
      var rx = m.side === "l" ? ax - w : ax;
      out += '<rect x="' + rx + '" y="' + (ny - 19) + '" width="' + w + '" height="26" rx="13"'
        + ' fill="#F5E7C3" stroke="#D9BE7C" stroke-width="1.5"/>'
        + '<text x="' + tx + '" y="' + ny + '" text-anchor="' + an + '" class="mtag">' + sub + '</text>';
    } else {
      out += '<text x="' + ax + '" y="' + ny + '" text-anchor="' + an + '" class="msub">' + sub + '</text>';
    }
  }
  return out + '</g>';
}

function mapDot(m){
  var ax = m.side === "l" ? m.x - 15 : m.x + 15;
  var an = m.side === "l" ? "end" : "start";
  return '<g><circle cx="' + m.x + '" cy="' + m.y + '" r="7" fill="#FFFFFF" stroke="#A89A7C" stroke-width="3.5"/>'
    + '<text x="' + ax + '" y="' + (m.y + 6) + '" text-anchor="' + an + '" class="mdot">' + m.label + '</text></g>';
}

function mapArea(x, y, txt){
  var w = txt.length * 23 + 26;
  return '<g><rect x="' + x + '" y="' + y + '" width="' + w + '" height="36" rx="18" fill="#1D4A33"/>'
    + '<text x="' + (x + w / 2) + '" y="' + (y + 25) + '" text-anchor="middle" class="marea">' + txt + '</text></g>';
}

function mapNorth(x, y){
  var d = "M" + x + "," + y
        + " L" + (x + 5) + "," + (y - 13)
        + " L" + (x + 10) + "," + y
        + " L" + (x + 5) + "," + (y - 4) + " Z";
  return '<g class="mnorth"><path d="' + d + '"/>'
    + '<text x="' + (x + 5) + '" y="' + (y + 15) + '" text-anchor="middle" class="mnote">北</text></g>';
}

function mapLabel(x, y, an, txt){
  var cls = /溪$/.test(txt) ? "mwater" : "mnote";
  return '<text x="' + x + '" y="' + y + '" text-anchor="' + an + '" class="' + cls + '">' + txt + '</text>';
}

function mapScale(x, y){
  return '<g class="mscale"><path d="M' + x + ',' + y + ' L' + (x + 100) + ',' + y + '"/>'
    + '<path d="M' + x + ',' + (y - 5) + ' L' + x + ',' + (y + 5) + '"/>'
    + '<path d="M' + (x + 100) + ',' + (y - 5) + ' L' + (x + 100) + ',' + (y + 5) + '"/>'
    + '<text x="' + (x + 50) + '" y="' + (y - 10) + '" text-anchor="middle" class="mnote">100 公尺</text></g>';
}

function mapPanel(cfg, key, rivers, roads, rail, route, scaleX, scaleY){
  var pins = MAP_PINS.filter(function(m){ return m.p === key; }).map(mapPin).join("");
  var dots = MAP_DOTS.filter(function(m){ return m.p === key; }).map(mapDot).join("");
  return '<svg class="mapsvg" viewBox="' + cfg.box + '" role="img" aria-label="' + cfg.title + '路線圖">'
    + '<g class="mriver">' + mapPaths(rivers, "") + '</g>'
    + '<g class="mroad">' + mapPaths(roads, "") + '</g>'
    + '<path class="mrail" d="' + rail + '"/>'
    + '<path class="mroute-case" d="' + route + '"/>'
    + '<path class="mroute" d="' + route + '"/>'
    + (key === "A"
        ? mapLabel(-124, -648, "end", "南勢溪") + mapLabel(108, -798, "start", "桶後溪")
          + mapNorth(228, -862) + mapLabel(38, -866, "start", "往公車總站・停車場")
          + mapArea(-286, -880, "老街區")
        : mapLabel(112, 928, "start", "南勢溪") + mapNorth(288, 872)
          + mapArea(-216, 845, "瀑布區"))
    + dots + pins
    + mapScale(scaleX, scaleY)
    + '</svg>';
}

function mapChips(){
  var out = "";
  TASKS.forEach(function(t){
    var zi = 1;
    ZONES.forEach(function(a, k){ if(a.id === t.zone) zi = k + 1; });
    var done = statusOf(t.id) === "approved";
    out += '<button class="chip z' + zi + (done ? " on" : "") + '" data-jump="' + t.id
      + '" data-jz="' + t.zone + '">' + (MAP_SHORT[t.id] || t.id) + '</button>';
  });
  return '<div class="chips">' + out + '</div>';
}

var MAP_SHORT = {
  m1:"館外裝置", m2:"織紋", m3:"Gaga 圓牌", m4:"山林展品",
  s1:"橋上合照", s2:"小吃", s3:"玻璃平台", s4:"壁畫",
  f1:"台車軌道", f2:"勇士像", f3:"導覽 QR", f4:"瀑布合影"
};

function pageMap(){
  return '<div class="topbar"><button class="back" id="bk">' + ICON_BACK + '返回總覽</button></div>'
    + '<h1 class="title" style="font-size:25px;margin-top:0">探索路線</h1>'
    + '<p class="sub">從烏來橋進老街，走到瀑布，全程約 2 公里</p>'
    + '<div class="weave" style="margin-top:10px;margin-bottom:12px"></div>'
    + mapPanel(MAP_A, "A", MAP_RIVER_A, MAP_ROAD_A, MAP_RAIL_A, MAP_ROUTE_A, -282, -408)
    + '<div class="mapgap"><i></i><span>烏來台車　1.3 公里　約 10 分鐘</span><i></i></div>'
    + mapPanel(MAP_B, "B", MAP_RIVER_B, MAP_ROAD_B, MAP_RAIL_B, MAP_ROUTE_B, -212, 1108)
    + '<h2 class="sect" style="margin:18px 0 8px">十二張任務</h2>'
    + mapChips()
    + '<p class="note">底圖依實際座標繪製，兩張圖同一比例。金色標籤的地方可以兌換，點任務標籤可直接跳到那一張卡。</p>';
}
function pageZone(){
  var z = ZONES.filter(function(x){ return x.id === view.zone; })[0];
  var zi = 1;
  ZONES.forEach(function(a, k){ if(a.id === z.id) zi = k + 1; });

  var pips = "";
  TASKS.forEach(function(t){
    if(t.zone === z.id) pips += '<i class="' + (statusOf(t.id) === "approved" ? "on" : "") + '"></i>';
  });

  var rows = TASKS.filter(function(x){ return x.zone === z.id; }).map(function(x){
    var st = statusOf(x.id), th = local.thumbs[x.id];
    return '<button class="task' + (st === "rejected" ? " rej" : "") + '" data-task="' + x.id + '">'
      + '<span class="thumb' + (th ? " has" : "") + '">' + (th ? '<img src="' + th + '" alt="">' : ICON_CAM) + '</span>'
      + '<span class="task-body"><span class="task-text">' + x.text + '</span>' + tagOf(st) + '</span></button>';
  }).join("");

  return '<div class="topbar"><button class="back" id="bk">' + ICON_BACK + '返回總覽</button></div>'
    + '<div class="zhead"><span class="zmark z' + zi + '"></span>'
    +   '<span class="zhead-main"><h1 class="title">' + z.name + '</h1>'
    +   '<span class="zsub z' + zi + '">' + z.sub + '</span></span>'
    +   '<span class="card-end"><span class="count">' + zoneCount(z.id) + ' / 4</span>'
    +   '<span class="pips">' + pips + '</span></span></div>'
    + '<div class="weave z' + zi + '" style="margin-top:18px;margin-bottom:16px"></div>' + rows;
}

function tagOf(s){
  if(s === "approved")  return '<span class="tag t-approved">已通過</span>';
  if(s === "pending")   return '<span class="tag t-pending">審核中</span>';
  if(s === "uploading") return '<span class="tag t-pending">上傳中</span>';
  if(s === "rejected")  return '<span class="tag t-rejected">退回，請重拍</span>';
  return '<span class="tag t-todo">未完成</span>';
}

function uploadMsg(id){
  var j = null;
  for(var i = 0; i < queue.length; i++){ if(queue[i].taskId === id){ j = queue[i]; break; } }
  if(j && (j.tries || 0) >= 3){
    return "送了 " + j.tries + " 次都沒成功（" + (j.err || "連線失敗") + "）。程式還在重試，也可以直接重拍一張。";
  }
  return "照片在背景上傳中，可以先去下一個任務，收訊恢復會自動送出。";
}

function pageTask(){
  var x = TASKS.filter(function(a){ return a.id === view.task; })[0];
  var z = ZONES.filter(function(a){ return a.id === x.zone; })[0];
  var st = statusOf(x.id), th = local.thumbs[x.id];

  var msg = {
    todo:      "拍好之後會送出審核，工作人員確認就會計入進度。",
    uploading: uploadMsg(x.id),
    pending:   "已送出，工作人員審核中。通過時這頁會自動更新。",
    approved:  "已通過，這張卡收進圖鑑了。",
    rejected:  "這張沒通過，照著任務敘述再拍一次就好。"
  }[st];

  var btn = "";
  if(st === "uploading"){
    btn = '<div class="bar"><i></i></div>'
        + '<button class="btn ghost" data-shoot="cam">重拍一張</button>'
        + '<button class="btn ghost" data-shoot="lib">改從相簿選</button>';
  }else if(st !== "approved"){
    var main = st === "rejected" ? "重新拍照" : st === "pending" ? "換一張照片" : "拍照";
    var cls  = st === "pending" ? "btn ghost" : "btn";
    btn = '<button class="' + cls + '" data-shoot="cam">' + main + '</button>'
        + '<button class="btn ghost" data-shoot="lib">從相簿選照片</button>';
  }

  var zi = 1;
  ZONES.forEach(function(a, k){ if(a.id === z.id) zi = k + 1; });

  return '<div class="topbar"><button class="back" id="bk">' + ICON_BACK + z.name + '</button></div>'
    + '<div class="hero' + (th ? " has" : "") + '">'
    +   (th ? '<img src="' + th + '" alt="">' : ICON_CAM + '<span>還沒有照片</span>') + '</div>'
    + '<div class="tagrow"><span class="tag t-zone z' + zi + '">' + z.name + '</span>' + tagOf(st) + '</div>'
    + '<h1 class="tasktitle">' + x.text + '</h1>'
    + '<p class="note">' + msg + '</p>' + btn;
}

function bind(){
  var bk = document.getElementById("bk");
  if(bk) bk.onclick = function(){ view.page === "task" ? go("zone",{zone:view.zone}) : go("home"); };

  var mp = document.querySelector("[data-map]");
  if(mp) mp.onclick = function(){ go("map"); };

  Array.prototype.forEach.call(document.querySelectorAll("[data-zone]"), function(b){
    b.onclick = function(){ go("zone", { zone:b.getAttribute("data-zone") }); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-task]"), function(b){
    b.onclick = function(){ go("task", { zone:view.zone, task:b.getAttribute("data-task") }); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-jump]"), function(b){
    b.onclick = function(){
      go("task", { zone:b.getAttribute("data-jz"), task:b.getAttribute("data-jump") });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-shoot]"), function(b){
    b.onclick = function(){ shoot(view.task, b.getAttribute("data-shoot")); };
  });

  var rs = document.getElementById("reset");
  if(rs) rs.onclick = function(){
    if(!confirm("重設會清掉名字與這支手機上的照片，進度也會重新開始，確定嗎？")) return;
    if(fref) fref.remove();
    localStorage.removeItem(LS_FID); localStorage.removeItem(LS_LOCAL); localStorage.removeItem(LS_QUEUE);
    location.reload();
  };
}

connect();
render();
pump();
</script>
</body>
</html>
